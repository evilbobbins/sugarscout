services:
  glucotrack:
    build: .
    container_name: sugarscout
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/app.db
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      # Persistent storage for the SQLite database
      - ./data:/app/data
    restart: unless-stopped
